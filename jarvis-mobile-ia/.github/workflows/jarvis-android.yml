name: JARVIS Mobile IA - Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'jarvis-mobile-ia/**'
      - '.github/workflows/jarvis-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-mobile-ia
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mobile-ia-debug
          path: jarvis-mobile-ia/app/build/outputs/apk/debug/*.apk
