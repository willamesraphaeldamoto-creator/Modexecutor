name: Build JARVIS Mobile IA
on:
  workflow_dispatch:
  push:
    paths:
      - "jarvis-mobile-ia/**"
      - ".github/workflows/jarvis-mobile-ia.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-mobile-ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle clean assembleDebug --no-daemon --stacktrace
      - run: ls -lah app/build/outputs/apk/debug && test -f app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mobile-IA-APK
          path: ${{ github.workspace }}/jarvis-mobile-ia/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

# build-ok
