name: Build JARVIS Mobile IA

on:
  workflow_dispatch:
  push:
    paths:
      - "jarvis-mobile-ia/**"
      - ".github/workflows/jarvis-mobile-ia.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK JARVIS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: jarvis-mobile-ia

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar APK Debug
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mobile-IA-APK
          path: jarvis-mobile-ia/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
